[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# script/seed: seed JSON is read-only in spirit, but DualRegister writes the
# dual-registered.json id mapping there — read-write for scripts + tests.
fs_permissions = [{ access = "read-write", path = "./script/seed" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
