# Lantern indexer schema (docs/indexer.md).
# Entity ids are the on-chain numeric ids as decimal strings:
#   Agent.id        = agentId        (AgentRegistry)
#   Attestation.id  = tokenId        (Reputation ERC-5192)

enum ActionType {
  STAKE
  UNSTAKE
  HARVEST
  SWAP
}

enum ActionResult {
  SUCCESS
  FAIL
}

type Agent {
  id: ID!
  owner: String!
  uri: String!
  registeredAt: BigInt!
  updatedAt: BigInt
  attestations: [Attestation!]! @derivedFrom(field: "agent")
  trades: [Trade!]! @derivedFrom(field: "agent")
}

type Attestation {
  id: ID!
  agent: Agent!
  tokenId: BigInt!
  actionType: ActionType!
  result: ActionResult!
  amount: BigInt
  protocol: String
  uri: String
  mintedAt: BigInt!
  blockNumber: BigInt!
  txHash: String!
}

# --- Lantern Market (docs/market.md) ---
#   Pool.id  = pool contract address
#   Trade.id = settlement tx hash (one executeSwap per tx in v1)

type Pool {
  id: ID!
  token0: String!
  token1: String!
  reserve0: BigInt!
  reserve1: BigInt!
  updatedAtBlock: BigInt!
}

type Trade {
  id: ID!
  agent: Agent!
  user: String!
  tokenIn: String!
  tokenOut: String!
  amountIn: BigInt!
  amountOut: BigInt!
  fee: BigInt!
  nonce: BigInt!
  settledAt: BigInt!
  blockNumber: BigInt!
  txHash: String!
}
