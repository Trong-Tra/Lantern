# Lantern indexer schema (docs/indexer.md).
# Entity ids are the on-chain numeric ids as decimal strings:
#   Agent.id        = agentId        (AgentRegistry)
#   Attestation.id  = tokenId        (Reputation ERC-5192)

enum ActionType {
  STAKE
  UNSTAKE
  HARVEST
  SWAP
}

enum ActionResult {
  SUCCESS
  FAIL
}

type Agent {
  id: ID!
  owner: String!
  uri: String!
  registeredAt: BigInt!
  updatedAt: BigInt
  attestations: [Attestation!]! @derivedFrom(field: "agent")
}

type Attestation {
  id: ID!
  agent: Agent!
  tokenId: BigInt!
  actionType: ActionType!
  result: ActionResult!
  amount: BigInt
  protocol: String
  uri: String
  mintedAt: BigInt!
  blockNumber: BigInt!
  txHash: String!
}
